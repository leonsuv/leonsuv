<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" width="900" height="176" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111824"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.2" r="0.65">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="175" rx="16" fill="url(#bg)" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="174" rx="15.5" fill="url(#dots)"/>
  <rect x="1" y="1" width="898" height="174" rx="15.5" fill="url(#glow)"/>
  <rect x="1" y="1" width="898" height="174" rx="15.5" fill="url(#glow2)"/>

  <!-- Left: Identity -->
  <text x="44" y="76" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.2">leonsuv<tspan fill="#58a6ff">.</tspan></text>
  <text x="44" y="109" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Native macOS · Rust · Automotive &amp; Sim Racing · Local-First</text>
  <text x="44" y="138" fill="#6e7681" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="12">Leon · Germany</text>

  <!-- Right: Clean monochrome stack pills (2 rows x 3 cols) -->
  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="500" text-anchor="middle">
    <!-- Row 1 -->
    <rect x="572" y="54" width="88" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="616" y="73" fill="#e6edf3">Rust</text>

    <rect x="670" y="54" width="88" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="714" y="73" fill="#e6edf3">Swift</text>

    <rect x="768" y="54" width="88" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="812" y="73" fill="#e6edf3">Kotlin</text>

    <!-- Row 2 -->
    <rect x="572" y="94" width="88" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="616" y="113" fill="#c9d1d9">TypeScript</text>

    <rect x="670" y="94" width="88" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="714" y="113" fill="#c9d1d9">Python</text>

    <rect x="768" y="94" width="88" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="812" y="113" fill="#c9d1d9">C / Go</text>
  </g>
</svg>
