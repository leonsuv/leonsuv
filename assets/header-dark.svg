<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" width="900" height="176" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111824"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c222b"/>
      <stop offset="100%" stop-color="#141920"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.2" r="0.65">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="175" rx="16" fill="url(#bg)" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="174" rx="15.5" fill="url(#dots)"/>
  <rect x="1" y="1" width="898" height="174" rx="15.5" fill="url(#glow)"/>
  <rect x="1" y="1" width="898" height="174" rx="15.5" fill="url(#glow2)"/>

  <!-- Left: Identity -->
  <text x="44" y="76" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.2">leonsuv<tspan fill="#58a6ff">.</tspan></text>
  <text x="44" y="109" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">Native macOS · Rust · Automotive &amp; Sim Racing · Local-First</text>
  <text x="44" y="137" fill="#6e7681" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="12">Leon · Germany</text>

  <!-- Right: Language chips with glowing color dots (2 rows x 3 cols) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500">
    <!-- Row 1 -->
    <g transform="translate(518, 48)">
      <rect width="106" height="34" rx="10" fill="url(#pill)" stroke="#30363d"/>
      <circle cx="18" cy="17" r="7" fill="#dea584" fill-opacity="0.22"/>
      <circle cx="18" cy="17" r="3.6" fill="#dea584"/>
      <text x="31" y="21.5" fill="#e6edf3">Rust</text>
    </g>

    <g transform="translate(634, 48)">
      <rect width="106" height="34" rx="10" fill="url(#pill)" stroke="#30363d"/>
      <circle cx="18" cy="17" r="7" fill="#f05138" fill-opacity="0.22"/>
      <circle cx="18" cy="17" r="3.6" fill="#f05138"/>
      <text x="31" y="21.5" fill="#e6edf3">Swift</text>
    </g>

    <g transform="translate(750, 48)">
      <rect width="106" height="34" rx="10" fill="url(#pill)" stroke="#30363d"/>
      <circle cx="18" cy="17" r="7" fill="#a97bff" fill-opacity="0.22"/>
      <circle cx="18" cy="17" r="3.6" fill="#a97bff"/>
      <text x="31" y="21.5" fill="#e6edf3">Kotlin</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(518, 94)">
      <rect width="106" height="34" rx="10" fill="url(#pill)" stroke="#30363d"/>
      <circle cx="18" cy="17" r="7" fill="#3178c6" fill-opacity="0.26"/>
      <circle cx="18" cy="17" r="3.6" fill="#58a6ff"/>
      <text x="31" y="21.5" fill="#e6edf3">TypeScript</text>
    </g>

    <g transform="translate(634, 94)">
      <rect width="106" height="34" rx="10" fill="url(#pill)" stroke="#30363d"/>
      <circle cx="18" cy="17" r="7" fill="#ffd43b" fill-opacity="0.20"/>
      <circle cx="18" cy="17" r="3.6" fill="#ffd43b"/>
      <text x="31" y="21.5" fill="#e6edf3">Python</text>
    </g>

    <g transform="translate(750, 94)">
      <rect width="106" height="34" rx="10" fill="url(#pill)" stroke="#30363d"/>
      <circle cx="18" cy="17" r="7" fill="#00add8" fill-opacity="0.22"/>
      <circle cx="18" cy="17" r="3.6" fill="#00add8"/>
      <text x="31" y="21.5" fill="#e6edf3">C / Go</text>
    </g>
  </g>
</svg>
