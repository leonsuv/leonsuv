<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" width="900" height="176" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.2" r="0.65">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#8250df" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2328" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="175" rx="16" fill="url(#bg)" stroke="#d0d7de"/>
  <rect x="1" y="1" width="898" height="174" rx="15.5" fill="url(#dots)"/>
  <rect x="1" y="1" width="898" height="174" rx="15.5" fill="url(#glow)"/>
  <rect x="1" y="1" width="898" height="174" rx="15.5" fill="url(#glow2)"/>

  <!-- Left: Identity -->
  <text x="44" y="76" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.2">leonsuv<tspan fill="#0969da">.</tspan></text>
  <text x="44" y="109" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Native macOS · Rust · Automotive &amp; Sim Racing · Local-First</text>
  <text x="44" y="138" fill="#6e7781" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="12">Leon · Germany</text>

  <!-- Right: Clean monochrome stack pills (2 rows x 3 cols) -->
  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="500" text-anchor="middle">
    <!-- Row 1 -->
    <rect x="572" y="54" width="88" height="30" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="616" y="73" fill="#1f2328">Rust</text>

    <rect x="670" y="54" width="88" height="30" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="714" y="73" fill="#1f2328">Swift</text>

    <rect x="768" y="54" width="88" height="30" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="812" y="73" fill="#1f2328">Kotlin</text>

    <!-- Row 2 -->
    <rect x="572" y="94" width="88" height="30" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="616" y="113" fill="#57606a">TypeScript</text>

    <rect x="670" y="94" width="88" height="30" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="714" y="113" fill="#57606a">Python</text>

    <rect x="768" y="94" width="88" height="30" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="812" y="113" fill="#57606a">C / Go</text>
  </g>
</svg>
